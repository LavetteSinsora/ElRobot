# XcodeGen spec. Run `xcodegen` in this folder to produce PhoneTeleop.xcodeproj.
name: PhoneTeleop
options:
  bundleIdPrefix: com.chrishe
  deploymentTarget:
    iOS: "16.0"
targets:
  PhoneTeleop:
    type: application
    platform: iOS
    sources: [PhoneTeleop]
    info:
      path: PhoneTeleop/Info.plist
      properties:
        CFBundleDisplayName: PhoneTeleop
        UILaunchScreen: {}
        NSCameraUsageDescription: "ARKit uses the camera to track the phone's 6-DoF pose."
        NSLocalNetworkUsageDescription: "Streams the phone pose to your Mac over the local network."
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrishe.phoneteleop
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
