# The ElRobot follower: one 7-DoF arm + gripper, 8 Feetech ST3215 servos on one serial bus.
#
# The robot profile `elrobot_deploy run` loads by default (`--profile NAME|PATH`). Every key can
# be overridden for one run with `--set section.key=value`. What each section means and who reads
# it: docs/architecture.md, "Configuration". Joint vectors are in servo order, base to gripper
# (index i = servo ID i+1); angles are degrees in the URDF's convention.

[robot]
# Relative paths are relative to the repository root (ElRobot/).
urdf = "description/elrobot_ours/elrobot.urdf"     # geometry, and the joint limits (calibrated)
calibration = "calibration/calibration.json"       # servo reading <-> URDF angle

[bus]
driver = "st3215"       # st3215 (the real bus) | sim (first-order lags, no hardware)
port = ""               # "" = find the Waveshare adapter by its USB id
hz = 250.0              # goal writes (and position reads) per second
slow_every = 5          # speed / load / temperature with every Nth read

[limits]
velocity_scale = 0.5    # x the URDF's <limit velocity> (4.71 rad/s, about no-load speed)
gripper_velocity_scale = 1.5   # the gripper's own: 1.5 x 4.71 rad/s = 400 deg/s, above the
                               # servo's own top (~300 deg/s), so the limit never slows it

[executor]
# How the bus process turns the 60 Hz target line into 250 Hz goals (runtime/execution/
# bus_servo.py). The per-joint lists are the servo tuning (HANDOFF.md section 5A); an empty list
# leaves that setting at the servo's own value (P, D) or off (friction).
filter_hz = 15.0        # critically damped command filter; 0 = the straight line
filter_lead = true      # read the line 2/w ahead so the filter adds no lag
squeeze_margin = 10.0   # deg: ON AN OBJECT, how far the jaw command may lead the measured jaw
                        # toward closed (sets the grip force: about P x this)
jaw_free_lead = 90.0    # deg: the same lead in free air, so the jaw closes at full effort
jaw_stall_speed = 15.0  # deg/s: contact = the jaw closing slower than this ...
jaw_contact_s = 0.08    # ... for this long while told to close
friction_v = 2.0        # deg/s over which friction compensation fades in
p_coef = []             # e.g. [32, 32, 32, 32, 16, 16, 16, 16]; written at connect, restored at release
d_coef = []             # e.g. [32, 32, 32, 32, 32, 32, 32, 32]
friction = []           # deg the goal leads in the direction of motion, e.g. [0, 0, 0, 0, 1, 1, 1, 0]
torque_limit = [500, 500, 500, 500, 400, 400, 400, 300]   # 0.1 % of stall torque (hardware cap)
goal_speed_factor = 1.5 # the servo's own speed ceiling, x the executor's velocity limit
acceleration = 0        # the servo's own ramp: 0 = off (the executor shapes the motion)

[poses]
# `home` is where every rollout starts: the TCP 25 cm out, 10 cm up, pitched 45 deg down.
# `exit` is where the session ends, and must be a pose the arm can be released in (the rest
# pose lies on the shoulder stop). Check both against the real arm before the first run.
# The gripper's open end is 3 deg (its calibrated range starts there).
home = [0, -30, 0, 35, 0, 40, 0, 3]
exit = [0, -90, 0, 90, 0, 0, 0, 3]
min_s = 2.0             # shortest ramp, s
velocity_margin = 0.5   # ramps peak at this fraction of the velocity limit
home_tol = 5.0          # deg: how far any joint may be from home once homing ends
release_at_exit = true  # torque off once the arm is at `exit` (else it stays held)

[ik]
# The IK P6 runs (runtime/ik/__init__.py lists the solvers). Everything else in this table is
# passed to the solver's factory as keyword arguments.
solver = "tcp_qp"
position_cost = 1.0
orientation_cost = 0.3
nominal_cost = 0.001

[teleop]
control_hz = 60.0       # the target grid: one IK solve per phone frame (ARKit's rate)
lead_s = 0.040          # phone capture -> due on the arm; covers the WiFi jitter
port = 5005             # UDP, where the phone sends
stale_s = 0.25          # no packet for this long while engaged: release (the arm holds)
scale = 1.0             # phone translation -> TCP translation
gripper_rate = 360.0    # deg/s the jaw command closes while GRIP is held, opens once released;
                        # the servo itself tops out near 300 deg/s (stroke ~0.45 s)
max_step_m = 0.05       # one frame moving the phone more than this: tracking glitch, release
max_step_deg = 30.0     # same, for rotation
# How the phone is held (the user's grip, 2026-10-17): screen facing LEFT, back camera RIGHT,
# the top (Dynamic Island) pointing FORWARD. In ARKit's camera axes that is forward = -X,
# left = +Z, up = +Y. Only forward is needed: up is gravity (ARKit's world +Y).
phone_forward = "-x"
# The robot's base axes (base_link: z up, the arm reaches along +y at the zero pose).
base_forward = [0.0, 1.0, 0.0]
base_up = [0.0, 0.0, 1.0]
# workspace_min = [-0.30, 0.08, 0.02]   # optional: clamp the TCP into this box (base frame, m;
# workspace_max = [0.30, 0.40, 0.35]    # the base's bottom is z = 0). Off: no box at all.

[safety]
# The bus process's guards (runtime/execution/guard.py). A RUNAWAY is a joint far off its
# command AND moving away from it (a lagging joint moves toward it, so it never counts); its
# torque goes off at once. BLOCKED is a joint far behind and not moving for a long time (not the
# gripper).
# Either one, with `recover`, brings the arm to the exit pose, then torque off.
# Lost position reads (the arm cannot be seen) always just hold, torque on.
runaway_deg = 25.0      # off by more than this ...
runaway_grow_deg = 10.0 # ... and the error grew this much, the joint moving that way ...
runaway_window_s = 0.3  # ... within this window
gross_deg = 60.0        # off by more than this: a runaway, whatever it is doing
blocked = true          # false: no BLOCKED rule at all (`run --runaway-only`)
lag_deg = 15.0          # BLOCKED: behind by more than this ...
lag_s = 1.5             # ... for this long, without a break ...
stuck_deg = 3.0         # ... and moving less than this in that time (a moving joint is not blocked)
read_fails = 5
guard_gripper = false   # the gripper fights its command by design: not checked
recover = true          # false: on a fault just hold where it is, torque on
recover_via_home = false   # true: recover through the home pose first (home, then rest)

[dashboard]
# The live dashboard (`elrobot_deploy run` starts it; `elrobot_deploy view` without the robot).
host = "127.0.0.1"      # "0.0.0.0" to open it from another device on the LAN (no password!)
port = 8080

# --- cameras ---------------------------------------------------------------------------------
# One [cameras.<name>] table per camera; each gets its own process (P2), arena ring and
# dashboard pane. Delete the table (or `run --no-cameras`) for none; `run --fake-cameras` swaps
# in synthetic frames. Override a key for one run with `--set cameras.wrist.exposure="camera"`.
# A second camera (an exocentric view) is another table, e.g. [cameras.exo] with
# lens = "normal", device = "<its name>". `elrobot_deploy camera list` shows what is plugged in;
# `elrobot_deploy camera test` runs one camera on its own and says how its exposure does.
# The code: runtime/cameras/ (docs/architecture.md, "Cameras").

[cameras.wrist]
# The HX200S 210 deg fisheye on the wrist (the same unit as g1d's fisheye wrists).
source = "usb"          # usb (this Mac's USB camera, via AVFoundation) | fake | v4l2 | realsense
device = "auto"         # auto = the one USB camera; or part of its name, its uniqueID, or
                        # "vid:pid" / "vid:pid@location" (two identical cameras: by location)
width = 1280            # the camera's own mode: no resize anywhere (g1d ran this lens at 720p;
height = 720            #   the HX200S also offers 1080p, with a bigger lens circle)
fps = 30
lens = "fisheye"        # fisheye: the lens circle is fitted at every start and each frame
                        # carries the square around it | normal: the whole frame
fallback_lens_circle = []   # [cx, cy, r] px, used only if the fit fails; [] = none
                            # (g1d's units at 720p: about [663, 334, 344])
# Exposure (runtime/cameras/exposure.py, "THE MODES"):
#   camera_first  the camera's own settings first; we meter inside the lens circle and take
#                 over (sticky) only if the disc stays clipped or dark. The default.
#   camera        the camera's own settings always (we only measure)
#   sticky        ours from the start: hold, correct only on a sustained need
#   servo         g1d's continuous loop
#   pinned        pinned_exposure / pinned_gain
exposure = "camera_first"
takeover_clip_pct = 15  # camera_first takes over when this much of the disc stays clipped (or
                        # the disc's mean >= 190, or it is dark). Measured 2026-10-17: the
                        # camera's own exposure clipped 7% (a lit monitor) and suited the
                        # workspace best; g1d's rig clipped 26%, a real failure
pinned_exposure = 200   # pinned: 100 us units (200 = 20 ms, two 50 Hz flicker periods)
pinned_gain = 64
white_balance = 0       # kelvin to pin while WE own exposure; 0 = leave white balance auto
slots = 8               # frames kept in the arena (~2.8 MB each at 720p)
required = false        # true: no session without this camera; false: warn and carry on
