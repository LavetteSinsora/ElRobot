# rtc — async; the adapter reads the arena for its frozen prefix.
# Every key: docs/deploying_a_policy/deploy_toml.md. The fully commented file: examples/deploy.toml.
robot = "g1d_fisheye_dex1"
prompt = "Wave."

[policy]
entry = "policy.py:Policy"

[checkpoint]
path = ""                       # no model

[control]
sync = false                    # async: the arm moves while the next chunk is inferred
replan_period = 10              # P/control_hz must exceed the inference latency
action_horizon = 50
control_hz = 30.0
blend = "blend.py:newest"       # README.md says why; the built-in "newest" is the same

