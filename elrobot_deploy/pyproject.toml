# elrobot_deploy — the deployment runtime for our ElRobot follower: teleoperation from an
# iPhone now, policies later. Ported from g1d_deploy (UPSTREAM.md); what changes and in which
# order is PORTING_PLAN.md.
#
# It depends on no learning framework or training stack: those are a policy's
# dependencies, never the runtime's.
#
# Two installs of the same package:
#
#   the runtime (this Mac):   `uv sync --extra runtime` — IK, the servo bus, cameras, dashboards.
#   a policy's own venv:      plain `pip install elrobot_deploy` — the core only (numpy): the
#       arena, the policy API and P5, which the runtime launches under the policy's interpreter.
[project]
name = "elrobot_deploy"
version = "0.1.0"
description = "Deployment runtime for the ElRobot follower arm: teleop and policies in, servo goals out, everything recorded"
requires-python = ">=3.11,<3.13"
dependencies = [
    # The core: what a policy's venv needs (tests/test_policy_interpreter.py
    # enforces that P5's import graph stays numpy + stdlib + the core).
    "numpy>=1.22.4",
]

[project.scripts]
elrobot_deploy = "elrobot_deploy.cli.main:main"

[project.optional-dependencies]
# Everything this machine runs besides P5's policy.
runtime = [
    "mujoco>=3.10",
    "mink",
    "qpsolvers[daqp]",
    "opencv-python",   # JPEG decode in runtime/drivers/cameras.py
    "pyyaml",
]
# The ST3215 bus and calibration live in the repo's bring-up package (../elrobot). It has no
# build config yet, so the bus process (deferred, PORTING_PLAN.md workstream A) will add it then.
# In a policy's venv, to run inspection's policy replay there (it poses the
# replayed actions on the model and decodes the recorded frames).
replay = ["opencv-python-headless", "mujoco>=3.10"]

[dependency-groups]
# `uv sync` installs this by default; `uv sync --no-dev` on a box that only runs.
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# The IK stack at the versions g1d_deploy ran on its robot. Newer releases move the QP's
# answer; lift these deliberately, together, with the IK tests.
constraint-dependencies = [
    "mujoco==3.10.0",
    "mink==1.2.0",
    "qpsolvers==4.12.0",
    "daqp==0.8.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elrobot_deploy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a real checkpoint and compiles (tens of seconds)"]
