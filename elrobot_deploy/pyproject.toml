# elrobot_deploy — the deployment runtime for our ElRobot follower: teleoperation from an
# iPhone now, policies later. Ported from g1d_deploy (UPSTREAM.md); what changes and in which
# order is PORTING_PLAN.md.
#
# It depends on no learning framework or training stack: those are a policy's
# dependencies, never the runtime's.
#
#   the runtime (this Mac):   plain `uv sync`: everything a session needs (the IK stack, the
#       servo bus, the cameras) plus the dev tools. Add any new runtime dependency to the
#       `runtime` group below so this stays the one command.
#   the core alone:           plain `pip install elrobot_deploy` (numpy): the arena, the config,
#       the executor maths. What a future policy venv would import.
#
# `legacy_g1d/` (the g1d code not ported yet) is outside `src/`: not packaged, linted or tested.
[project]
name = "elrobot_deploy"
version = "0.1.0"
description = "Deployment runtime for the ElRobot follower arm: iPhone teleop (and policies, later) in, servo goals out"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.22.4",
]

[project.scripts]
elrobot_deploy = "elrobot_deploy.cli.main:main"

[dependency-groups]
# Everything a session runs, in one group that `uv sync` installs by default (default-groups
# below). A new runtime dependency goes here, with a comment saying who needs it.
runtime = [
    # P6's IK: mujoco, mink, a QP solver.
    "mujoco>=3.10",
    "mink",
    "qpsolvers[daqp]",
    # The ST3215 bus and calibration: the repo's bring-up package (../elrobot), used by the
    # bus process (runtime/drivers/st3215_driver.py).
    "elrobot",
    # The cameras (runtime/cameras/): OpenCV for the image maths and the dashboard's view;
    # AVFoundation through pyobjc for frames on a Mac (not OpenCV's macOS backend: sources.py
    # says why); pyusb + a bundled libusb for the UVC controls (exposure, gain) beside the stream.
    "opencv-python-headless>=4.8",
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=10; sys_platform == 'darwin'",
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# `uv sync` installs both groups: one command for a full environment.
default-groups = ["runtime", "dev"]
# The IK stack at the versions g1d_deploy ran on its robot. Newer releases move the QP's
# answer; lift these deliberately, together, with the IK tests.
constraint-dependencies = [
    "mujoco==3.10.0",
    "mink==1.2.0",
    "qpsolvers==4.12.0",
    "daqp==0.8.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
elrobot = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/elrobot_deploy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy_g1d"]
