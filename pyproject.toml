[project]
name = "elrobot"
version = "0.1.0"
description = "ElRobot follower bring-up tools (servo IDs, calibration, cameras)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "servo_setup"]
pythonpath = [".", "tests", "servo_setup"]

# Packaged (only `elrobot/`) so elrobot_deploy can depend on the bus and calibration code.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elrobot"]
